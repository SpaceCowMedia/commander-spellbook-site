name: Scryfall symbology

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

defaults:
  run:
    shell: bash

concurrency:
  group: symbology
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    if: github.repository == 'SpaceCowMedia/commander-spellbook-site'
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      BRANCH: chore/scryfall-symbology
      SYMBOLOGY: public/images/scryfall/symbols src/assets/symbology.json
      CYPRESS_INSTALL_BINARY: 0
      HUSKY: 0
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7

      - name: Setup pnpm 📦
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node ⬢
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install 📦
        run: pnpm install --frozen-lockfile

      - name: Download the symbology 🔣
        run: pnpm symbology

      - name: Open a pull request 📬
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: GitHub Actions
          GIT_AUTHOR_EMAIL: action@github.com
          GIT_COMMITTER_NAME: GitHub Actions
          GIT_COMMITTER_EMAIL: action@github.com
          # A fix, so that merging it releases the new symbols.
          TITLE: "fix: update the Scryfall symbology"
        run: |
          git add -A -- $SYMBOLOGY
          if git diff --cached --quiet; then
            echo "The symbology is up to date"
            exit 0
          fi
          git switch -c "$BRANCH"
          git commit -m "$TITLE"

          # An open pull request, or one closed without merging, is not pushed again until Scryfall changes again.
          if git fetch --quiet origin "$BRANCH" 2>/dev/null && git diff --quiet FETCH_HEAD HEAD -- $SYMBOLOGY; then
            echo "$BRANCH already has this symbology"
            exit 0
          fi
          git push --force origin "$BRANCH"

          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            {
              echo "[Scryfall's symbology](https://api.scryfall.com/symbology) changed, so \`pnpm symbology\` downloaded it again."
              echo
              echo '```'
              git diff --stat HEAD~1 HEAD
              echo '```'
            } > "$RUNNER_TEMP/body.md"
            gh pr create --base main --head "$BRANCH" --title "$TITLE" --body-file "$RUNNER_TEMP/body.md"
          fi

          # Pushes and pull requests made with the GITHUB_TOKEN start no workflows, so CI is dispatched instead.
          gh workflow run ci.yml --ref "$BRANCH"
