name: CI/CD

on:
  pull_request:
  push:
    branches:
      - "*"
    tags:
      - "*"
  workflow_dispatch:

defaults:
  run:
    shell: bash

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      packages: read
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7

      - name: Setup pnpm 📦
        uses: pnpm/action-setup@v6.0.10

      - name: Setup Node ⬢
        uses: actions/setup-node@v7
        with: &setup-node
          node-version: 26
          cache: pnpm

      - name: Install Node Modules 📦
        run: pnpm install --frozen-lockfile

      # Turbopack's filesystem cache (on by default since Next 16.3) lives in .next/cache.
      # Containerised runners start clean, so it only pays off if restored explicitly.
      - name: Cache Next build 💾
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-prod-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', '*.ts', '*.mjs') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-prod-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-nextjs-prod-

      - name: Build 🏗️
        run: pnpm run build

  lint:
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7

      - name: Setup pnpm 📦
        uses: pnpm/action-setup@v6.0.10

      - name: Setup Node ⬢
        uses: actions/setup-node@v7
        with: *setup-node

      - name: Install 📦
        run: pnpm install --frozen-lockfile

      - name: Run lint 👀
        run: pnpm run lint

  type-check:
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7

      - name: Setup pnpm 📦
        uses: pnpm/action-setup@v6.0.10

      - name: Setup Node ⬢
        uses: actions/setup-node@v7
        with: *setup-node

      - name: Install 📦
        run: pnpm install --frozen-lockfile

      - name: Run typescript 👀
        run: pnpm tsc --noEmit

  test:
    runs-on: ubuntu-22.04
    needs: build
    strategy:
      matrix:
        browser: [chrome, firefox, edge, electron]
      fail-fast: false
    env:
      # Discord is not reachable from CI, so the tests log in with a plain account instead.
      CYPRESS_username: cypress
      CYPRESS_password: cypress-password
    steps:
      - name: Setup Docker Buildx 🐳
        uses: docker/setup-buildx-action@v4

      - name: Checkout 🛎️
        uses: actions/checkout@v7

      - name: Setup pnpm 📦
        uses: pnpm/action-setup@v6.0.10

      - name: Setup Node ⬢ # This needs to be done after checkout
        uses: actions/setup-node@v7
        with: *setup-node

      - name: Install 📦
        run: pnpm install --frozen-lockfile

      # Keyed separately from the `build` job: that one compiles for production,
      # this one for NODE_ENV=test, so they must not share a cache entry.
      - name: Cache Next build 💾
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-test-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', '*.ts', '*.mjs') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-test-${{ hashFiles('pnpm-lock.yaml') }}-
            ${{ runner.os }}-nextjs-test-

      - name: Startup Backend Service 🖥️
        uses: ./.github/actions/backend/
        timeout-minutes: 15
        with:
          port: "8000"
          username: ${{ env.CYPRESS_username }}
          email: cypress@commanderspellbook.com
          password: ${{ env.CYPRESS_password }}

      - name: Cypress run 🧪
        uses: cypress-io/github-action@v7
        with:
          install-command: "true"
          build: pnpm build:test
          start: pnpm start:test
          wait-on: "http://localhost:3000, http://localhost:8000"
          browser: ${{ matrix.browser }}

  docker:
    runs-on: ubuntu-22.04
    permissions:
      packages: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and export image
        uses: docker/build-push-action@v7
        with:
          push: false
          load: true
          context: .
          tags: spellbook-client:latest
          secrets: |
            "github_token=${{ secrets.GITHUB_TOKEN }}"
          outputs: type=docker,dest=/tmp/spellbook-client.tar

      - name: Upload image artifact 📦
        uses: actions/upload-artifact@v7
        with:
          name: spellbook-client
          path: /tmp/spellbook-client.tar

  # The Cypress job builds from source, so a Dockerfile that produces an image which cannot
  # boot still passes it. Run the artifact the deploy actually ships instead, and probe the
  # path the readiness probe uses, so the cluster is never the first thing to try it.
  integration-test:
    runs-on: ubuntu-22.04
    needs: docker
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7

      - name: Setup Docker Buildx 🐳
        uses: docker/setup-buildx-action@v4

      - name: Download image artifact ⬇
        uses: actions/download-artifact@v8
        with:
          name: spellbook-client
          path: /tmp

      - name: Load docker image 🐳
        run: |
          docker load --input /tmp/spellbook-client.tar
          docker image ls -a

      - name: Start the image 🧫
        run: |
          docker run -d --name spellbook-client \
            -e BUILD_TYPE=prod \
            -p 3000:3000 \
            spellbook-client:latest

      - name: Serve the readiness path 🧪
        run: |
          for _ in $(seq 1 60); do
            if ! docker ps -q --filter name=spellbook-client --filter status=running | grep -q .; then
              echo "::error::Container exited instead of serving"
              exit 1
            fi
            if curl -fsS -o /dev/null http://localhost:3000/; then
              echo "Image served / successfully"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Image did not serve / within 120s"
          exit 1

      # Always, so the crash that failed the probe is in the log next to it.
      - name: Container logs 📄
        if: always()
        run: docker logs spellbook-client

  release:
    runs-on: ubuntu-22.04
    needs:
      - build
      - lint
      - type-check
      - test
      - docker
      - integration-test
    if: github.ref == 'refs/heads/main' && github.ref_type == 'branch' && github.repository == 'SpaceCowMedia/commander-spellbook-site'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      GIT_AUTHOR_NAME: GitHub Actions
      GIT_AUTHOR_EMAIL: action@github.com
      GIT_COMMITTER_NAME: GitHub Actions
      GIT_COMMITTER_EMAIL: action@github.com
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout full commit history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node ⬢
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
      - name: Install semantic-release
        run: npm -g install @semantic-release/git @semantic-release/exec semantic-release
      - id: release
        name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

  deploy:
    runs-on: ubuntu-22.04
    needs: [build, release]
    if: needs.release.outputs.version
    concurrency:
      group: production
      cancel-in-progress: false
    environment: scm-production
    permissions:
      id-token: write # This is required for requesting the JWT
      contents: read # This is required for actions/checkout
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download image artifact 📦
        uses: actions/download-artifact@v8
        with:
          name: spellbook-client
          path: /tmp

      - name: Load image 🐳
        run: docker load --input /tmp/spellbook-client.tar

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: github-actions
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Copy Static Files to S3
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          id=$(docker create spellbook-client:latest)
          docker cp $id:/app/.next/static _next
          docker rm -v $id

          aws s3 cp \
            --recursive \
            --cache-control "max-age=2592000" \
            --exclude "*" \
            --include "*.js" \
            --content-type "text/javascript; charset=utf-8" \
            _next/ s3://$S3_BUCKET/_next/static

          aws s3 cp \
            --recursive \
            --cache-control "max-age=2592000" \
            --exclude "*" \
            --include "*.css" \
            --content-type "text/css; charset=utf-8" \
            _next/ s3://$S3_BUCKET/_next/static

          # Other files will not have UTF-8 set
          aws s3 cp \
            --recursive \
            --cache-control "max-age=2592000" \
            --exclude "*.js" \
            --exclude "*.css" \
            _next/ s3://$S3_BUCKET/_next/static

      - name: Create Cloudfront Invalidation
        env:
          DISTRIBUTION_ID: ${{ secrets.DISTRIBUTION_ID }}
        run: |
          aws cloudfront create-invalidation \
          --distribution-id $DISTRIBUTION_ID \
          --paths "/*"

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.AWS_ECR_REPO_NAME }}
          IMAGE_TAG: ${{ needs.release.outputs.version }}
        run: |
          docker tag spellbook-client:latest $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker tag spellbook-client:latest $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push --all-tags $ECR_REGISTRY/$ECR_REPOSITORY

  rollout:
    runs-on: ubuntu-22.04
    needs: [build, deploy, release]
    permissions:
      id-token: write # This is required for requesting the JWT
      contents: read # This is required for actions/checkout
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      # Every step below reads the namespace from here. The update and the wait naming
      # different namespaces is what let a rollout that never happened report success.
      NAMESPACE: spellbook-prod
      DEPLOYMENT: deployment/spellbook-client
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: github-actions
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Config kube
        env:
          CLUSTER_NAME: ${{ secrets.CLUSTER_NAME }}
        run: aws eks --region us-east-2 update-kubeconfig --name $CLUSTER_NAME --kubeconfig kubeconfig.yaml

      - name: Install and configure kubectl
        uses: azure/setup-kubectl@v5

      - name: Setup Kustomize 🛠
        uses: imranismail/setup-kustomize@v3

      - name: Run Kustomize to set image to the release 🛠
        working-directory: .kubernetes/app/prod
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.AWS_ECR_REPO_NAME }}
          IMAGE_TAG: ${{ needs.release.outputs.version }}
        run: |
          # The manifests carry no tag, so without this the deploy would fall back to :latest.
          if [ -z "$IMAGE_TAG" ]; then
            echo "::error::No released version to deploy"
            exit 1
          fi

          kustomize edit set image "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          # `kustomize edit` records the override without checking it against the resources,
          # so a name that matches nothing leaves the image untagged and silently deployable.
          if ! kustomize build . | grep -q "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"; then
            echo "::error::Image override did not match the manifests; refusing to deploy untagged"
            exit 1
          fi

      - name: Apply Kubernetes manifests
        run: |
          export KUBECONFIG=kubeconfig.yaml

          # deploy.sh applies these manifests but the pipeline never did, so anything changed
          # under .kubernetes/ only ever reached the cluster by hand. Apply the same directory
          # deploy.sh does, so the two paths cannot drift.
          kubectl apply -k .kubernetes/app/prod/

      - name: Wait for the rollout to finish
        run: |
          export KUBECONFIG=kubeconfig.yaml
          kubectl rollout status "$DEPLOYMENT" -n "$NAMESPACE" --timeout=10m
